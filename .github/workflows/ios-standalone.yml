name: Full Windows iOS preview installer

on:
  workflow_dispatch:
  push:
    branches: [ios-all-modes]
    paths:
      - '.github/workflows/ios-standalone.yml'
      - 'scripts/windows/standalone/**'
      - 'src-tauri/tauri.ios-preview.json'

permissions:
  contents: read

jobs:
  full-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PYTAURI_STANDALONE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      VITE_IOS_PREVIEW_BUILD: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: pnpm
      - name: Install frontend and set preview version
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/set-version.cjs '12.13.7+ios.4'
          node scripts/bundle-templates.cjs
      - name: Prepare the single bundled Python runtime
        run: |
          $url = 'https://github.com/astral-sh/python-build-standalone/releases/download/20251031/cpython-3.13.9+20251031-x86_64-pc-windows-msvc-install_only_stripped.tar.gz'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/python.tar.gz"
          New-Item -ItemType Directory src-tauri/pyembed -Force | Out-Null
          tar -xzf "$env:RUNNER_TEMP/python.tar.gz" -C src-tauri/pyembed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = (Resolve-Path src-tauri/pyembed/python/python.exe).Path
          "PYO3_PYTHON=$python" >> $env:GITHUB_ENV
          uv pip install --exact --python $python --override scripts/windows/ios-runtime-overrides.txt './src-tauri[ios]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -I -B -c "from adb_auto_player.device.ios.phone import Phone; from adb_auto_player.device.ios.video import VideoCapture; import av,lzfse"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build complete Windows application and NSIS installer
        run: |
          pnpm tauri build --config src-tauri/tauri.bundle.windows.json --config src-tauri/tauri.bundle.templates.json --config src-tauri/tauri.ios-preview.json -- --profile bundle-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify a fresh installation without the official app or any patch
        run: |
          $installers = @(Get-ChildItem target/bundle-release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one full installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'clean-ios-install'
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode) { throw "Installer failed: $($setup.ExitCode)" }
          & "$destination/python.exe" -I -B -c "import runpy; runpy.run_path(r'$env:GITHUB_WORKSPACE/scripts/windows/standalone/verify_install.py', run_name='__main__')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $app = Start-Process "$destination/adb-auto-player.exe" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw 'Freshly installed app exited during startup' }
          if (Test-Path "$env:TEMP/AdbAutoPlayer_crash.log") { throw 'App startup produced a crash log' }
          Stop-Process -Id $app.Id
          New-Item -ItemType Directory full-installer -Force | Out-Null
          $output = 'full-installer/AdbAutoPlayer-iOS-Support-12.13.7-ios.4-Windows-x64-Setup.exe'
          Copy-Item -LiteralPath $installers[0].FullName -Destination $output
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($output))" | Set-Content "$output.sha256" -Encoding utf8
          @{version='12.13.7+ios.4'; source_commit=$env:GITHUB_SHA; sha256=$hash; full_installer=$true; clean_install_verified=$true} | ConvertTo-Json | Set-Content full-installer/build-info.json
          Copy-Item scripts/windows/standalone/README.md full-installer/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: AdbAutoPlayer-iOS-Support-full-Windows-installer
          path: full-installer/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the verified full installer as an experimental prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v12.13.7-ios.4 full-installer/* --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'AdbAutoPlayer iOS Support - Full Windows Installer' --prerelease --notes-file scripts/windows/standalone/README.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

